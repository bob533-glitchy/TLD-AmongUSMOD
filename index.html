<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Among Us Legacy</title>

  <link rel="stylesheet" href="TemplateData/style.css">
  <script src="TemplateData/UnityProgress.js"></script>
  <script src="Build/UnityLoader.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    .webgl-content, #gameContainer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #gameContainer canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    .footer { display: none !important; }

    #logoButton {
      position: fixed;
      right: 22px;
      bottom: 22px;
      width: 66px;
      height: 66px;
      border: 2px solid #fff;
      border-radius: 50%;
      background: #050505;
      cursor: pointer;
      z-index: 10000;
      display: grid;
      place-items: center;
      color: white;
      font-size: 35px;
      box-shadow: 0 0 18px #ffffff33;
      transition: transform .15s, box-shadow .15s;
    }

    #logoButton:hover {
      transform: scale(1.08);
      box-shadow: 0 0 22px #ffffff66;
    }

    #logoButton img {
      width: 86%;
      height: 86%;
      object-fit: contain;
      border-radius: 50%;
    }

    #modMenu {
      position: fixed;
      right: 22px;
      bottom: 100px;
      width: 310px;
      max-width: calc(100vw - 28px);
      color: #eee;
      background: #14161c;
      border: 1px solid #383d48;
      border-radius: 14px;
      z-index: 9999;
      box-shadow: 0 12px 45px #000b;
      overflow: hidden;
      display: none;
    }

    #modMenu.open { display: block; }

    #menuHeader {
      padding: 15px;
      background: #20242d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: move;
      user-select: none;
      border-bottom: 1px solid #393e48;
      touch-action: none;
    }

    #menuHeader strong {
      font-size: 15px;
      letter-spacing: 1px;
    }

    #closeMenu {
      color: white;
      background: transparent;
      border: 0;
      font-size: 23px;
      cursor: pointer;
    }

    #tabs {
      display: flex;
      padding: 8px;
      gap: 6px;
      background: #191b22;
    }

    .tab {
      flex: 1;
      border: 0;
      padding: 9px 4px;
      color: #aaa;
      background: #242730;
      border-radius: 7px;
      cursor: pointer;
    }

    .tab.active {
      color: #101712;
      background: #7dffb2;
      font-weight: bold;
    }

    .tabContent {
      display: none;
      padding: 14px;
    }

    .tabContent.active { display: block; }

    .sectionTitle {
      color: #7dffb2;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 2px 0 12px;
    }

    .option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 0;
      border-bottom: 1px solid #292c35;
    }

    .option:last-child { border-bottom: 0; }

    .option label { font-size: 13px; }

    .option small {
      display: block;
      color: #858b98;
      font-size: 11px;
      margin-top: 4px;
    }

    .option input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: #7dffb2;
      cursor: pointer;
      flex-shrink: 0;
    }

    .option input[type="number"] {
      width: 68px;
      padding: 6px;
      color: white;
      background: #242730;
      border: 1px solid #454a56;
      border-radius: 6px;
    }

    #menuFooter {
      padding: 10px 14px;
      color: #7c8290;
      font-size: 10px;
      text-align: center;
      background: #101116;
    }

    @media (max-width: 480px) {
      #modMenu {
        right: 12px;
        bottom: 88px;
      }

      #logoButton {
        right: 14px;
        bottom: 14px;
      }
    }
  </
