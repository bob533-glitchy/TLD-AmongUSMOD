  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Among Us Legacy</title>

  <link rel="stylesheet" href="TemplateData/style.css">
  <script src="TemplateData/UnityProgress.js"></script>
  <script src="Build/UnityLoader.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    /* Fullscreen Unity wrapper */
    .webgl-content {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    #gameContainer {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #gameContainer canvas {
      position: absolute !important;
      left: 0 !important;
      top: 0 !important;
      display: block;
      width: 100% !important;
      height: 100% !important;
      border: 0;
      outline: none;
    }

    .footer {
      display: none !important;
    }

    /* Floating logo button */
    #logoButton {
      position: fixed;
      right: 22px;
      bottom: 22px;
      width: 70px;
      height: 70px;
      padding: 4px;
      display: grid;
      place-items: center;
      color: white;
      font-size: 34px;
      background: #050505;
      border: 2px solid #fff;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10000;
      box-shadow: 0 0 18px #ffffff33;
      transition: transform .15s, box-shadow .15s;
    }

    #logoButton:hover {
      transform: scale(1.08);
      box-shadow: 0 0 22px #ffffff66;
    }

    #logoButton img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }

    /* Menu panel */
    #modMenu {
      position: fixed;
      right: 22px;
      bottom: 104px;
      width: 310px;
      max-width: calc(100vw - 24px);
      max-height: calc(100vh - 125px);
      overflow-y: auto;
      color: #eee;
      background: #14161c;
      border: 1px solid #383d48;
      border-radius: 14px;
      box-shadow: 0 12px 45px #000b;
      display: none;
      z-index: 9999;
    }

    #modMenu.open {
      display: block;
    }

    #menuHeader {
      position: sticky;
      top: 0;
      padding: 15px;
      background: #20242d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: move;
      user-select: none;
      touch-action: none;
      border-bottom: 1px solid #393e48;
    }

    #menuHeader strong {
      font-size: 15px;
      letter-spacing: 1px;
    }

    #closeMenu {
      color: white;
      background: transparent;
      border: 0;
      font-size: 23px;
      cursor: pointer;
    }

    #tabs {
      display: flex;
      padding: 8px;
      gap: 6px;
      background: #191b22;
    }

    .tab {
      flex: 1;
      border: 0;
      padding: 9px 4px;
      color: #aaa;
      background: #242730;
      border-radius: 7px;
      cursor: pointer;
    }

    .tab.active {
      color: #101712;
      background: #7dffb2;
      font-weight: bold;
    }

    .tabContent {
      display: none;
      padding: 14px;
    }

    .tabContent.active {
      display: block;
    }

    .sectionTitle {
      color: #7dffb2;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 2px 0 12px;
    }

    .option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 0;
      border-bottom: 1px solid #292c35;
    }

    .option:last-child {
      border-bottom: 0;
    }

    .option label {
      font-size: 13px;
    }

    .option small {
      display: block;
      color: #858b98;
      font-size: 11px;
      margin-top: 4px;
    }

    .option input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: #7dffb2;
      cursor: pointer;
      flex-shrink: 0;
    }

    .option input[type="number"] {
      width: 68px;
      padding: 6px;
      color: white;
      background: #242730;
      border: 1px solid #454a56;
      border-radius: 6px;
    }

    #menuFooter {
      padding: 10px 14px;
      color: #7c8290;
      font-size: 10px;
      text-align: center;
      background: #101116;
    }

    @media (max-width: 480px) {
      #modMenu {
        right: 12px;
        bottom: 88px;
      }

      #logoButton {
        right: 14px;
        bottom: 14px;
        width: 60px;
        height: 60px;
      }
    }
  </style>



  <div class="webgl-content">
    <div id="gameContainer"></div>
  </div>

  <button id="logoButton" title="Open menu" aria-label="Open mod menu">
    <img src="logo.png" alt="Menu logo" onerror="this.style.display='none';this.parentElement.textContent='☻';">
  </button>

  <div id="modMenu">
    <div id="menuHeader">
      <strong>LEGACY TOOLS</strong>
      <button id="closeMenu" aria-label="Close menu">×</button>
    </div>

    <div id="tabs">
      <button class="tab active" data-tab="player">Player</button>
      <button class="tab" data-tab="visuals">Visuals</button>
      <button class="tab" data-tab="settings">Settings</button>
    </div>

    <div class="tabContent active" id="player">
      <div class="sectionTitle">Movement</div>

      <div class="option">
        <label>
          Noclip
          <small>UI prototype — not connected to movement</small>
        </label>
        <input type="checkbox" data-feature="noclip">
      </div>

      <div class="option">
        <label>
          Ghost-style movement
          <small>UI prototype — not connected to movement</small>
        </label>
        <input type="checkbox" data-feature="ghostMovement">
      </div>
    </div>

    <div class="tabContent" id="visuals">
      <div class="sectionTitle">Visual effects</div>

      <div class="option">
        <label>
          Red impostor highlight
          <small>Prototype toggle</small>
        </label>
        <input type="checkbox" data-feature="impostorHighlight">
      </div>

      <div class="option">
        <label>
          RGB crewmate effect
          <small>Prototype toggle</small>
        </label>
        <input type="checkbox" data-feature="rgbEffect">
      </div>
    </div>

    <div class="tabContent" id="settings">
      <div class="sectionTitle">Settings</div>

      <div class="option">
        <label>
          Custom kill cooldown
          <small>UI prototype — not connected to game logic</small>
        </label>
        <input type="checkbox" data-feature="customCooldown">
      </div>

      <div class="option">
        <label for="cooldown">Cooldown value (seconds)</label>
        <input id="cooldown" type="number" min="0" max="60" value="10">
      </div>
    </div>

    <div id="menuFooter">LEGACY BUILD · UI PROTOTYPE</div>
  </div>

  <script>
    (function () {
      "use strict";

      const menu = document.getElementById("modMenu");
      const logoButton = document.getElementById("logoButton");
      const closeButton = document.getElementById("closeMenu");
      const header = document.getElementById("menuHeader");

      // Open and close menu
      logoButton.addEventListener("click", function () {
        menu.classList.toggle("open");
      });

      closeButton.addEventListener("click", function () {
        menu.classList.remove("open");
      });

      // Switch tabs
      document.querySelectorAll(".tab").forEach(function (button) {
        button.addEventListener("click", function () {
          document.querySelectorAll(".tab").forEach(function (tab) {
            tab.classList.toggle("active", tab === button);
          });

          document.querySelectorAll(".tabContent").forEach(function (panel) {
            panel.classList.toggle(
              "active",
              panel.id === button.dataset.tab
            );
          });
        });
      });

      // Drag menu
      let dragging = false;
      let offsetX = 0;
      let offsetY = 0;

      header.addEventListener("pointerdown", function (event) {
        if (event.target.closest("button")) return;
        if (!menu.classList.contains("open")) return;

        dragging = true;

        const rect = menu.getBoundingClientRect();
        offsetX = event.clientX - rect.left;
        offsetY = event.clientY - rect.top;

        header.setPointerCapture(event.pointerId);
      });

      header.addEventListener("pointermove", function (event) {
        if (!dragging) return;

        const maxX = Math.max(0, window.innerWidth - menu.offsetWidth);
        const maxY = Math.max(0, window.innerHeight - menu.offsetHeight);

        const x = Math.max(
          0,
          Math.min(maxX, event.clientX - offsetX)
        );

        const y = Math.max(
          0,
          Math.min(maxY, event.clientY - offsetY)
        );

        menu.style.left = x + "px";
        menu.style.top = y + "px";
        menu.style.right = "auto";
        menu.style.bottom = "auto";
      });

      function stopDragging() {
        dragging = false;
      }

      header.addEventListener("pointerup", stopDragging);
      header.addEventListener("pointercancel", stopDragging);
      header.addEventListener("lostpointercapture", stopDragging);

      // Start Unity after the page loads
      window.addEventListener("load", function () {
        if (typeof UnityLoader === "undefined") {
          console.error(
            "UnityLoader failed to load. Check Build/UnityLoader.js."
          );
          return;
        }

        try {
          window.gameInstance = UnityLoader.instantiate(
            "gameContainer",
            "Build/AmongUSWebPortByTSProllyFinalBuild9.json",
            {
              onProgress: function (instance, progress) {
                if (typeof UnityProgress === "function") {
                  UnityProgress(instance, progress);
                }
              }
            }
          );
        } catch (error) {
          console.error("Unity startup failed:", error);
        }
      });
    })();
  </script>


<script></script></body></html>
